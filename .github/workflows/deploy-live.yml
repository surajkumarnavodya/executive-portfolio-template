name: Deploy live site

# Publishes ONLY tools/package-live.sh's output to GitHub Pages, instead of
# Pages serving the repo root directly. The repo root also contains the
# commercial-template product (studio.html, portfolio.json, the Studio JS
# modules, assets/demo-data/) which must never be reachable at the live
# personal-portfolio domain — see tools/package-live.sh for the full
# exclusion list and why (studio.html's "Export Website ZIP" feature fetches
# same-origin sibling files, which is exploitable if the two products are
# ever served from the same origin).
#
# One-time setup required in the GitHub UI (not in this file):
#   Settings -> Pages -> Source -> "GitHub Actions"
# Until that's set, Pages may still be serving the repo root directly.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the live-only artifact
        run: |
          bash tools/package-live.sh portfolio-live.zip "$GITHUB_SHA"
          mkdir -p _site
          unzip -q portfolio-live.zip -d _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
