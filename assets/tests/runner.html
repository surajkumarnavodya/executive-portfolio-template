<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Studio Test Runner</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 2rem; line-height: 1.5; }
      button { padding: 0.6rem 1rem; cursor: pointer; }
      pre { background: #111827; color: #f9fafb; padding: 1rem; border-radius: 0.5rem; overflow: auto; }
      .test-shell { display: none; }
    </style>
  </head>
  <body>
    <h1>Portfolio Studio Asset Tests</h1>
    <p>Run the browser-based asset tests and inspect their output below.</p>
    <button id="runTests">Run tests</button>
    <pre id="output">Waiting for tests…</pre>

    <div class="test-shell" id="studioTestShell">
      <div id="assetManager"></div>
      <div id="previewContent"></div>
      <div id="validationSummary"></div>
      <div id="healthDashboard"></div>
      <div id="statusMessage"></div>
      <div id="studioLayout"></div>
      <div id="studioDivider"></div>
      <input id="assetUploadInput" type="file">
      <input id="assetReplaceInput" type="file">
      <input id="importInput" type="file">
      <button id="importPortfolio"></button>
      <button id="exportJson"></button>
      <button id="exportZip"></button>
      <button id="downloadValidationReport"></button>
      <button id="undoAction"></button>
      <button id="redoAction"></button>
      <button id="restoreSession"></button>
      <button id="resetOriginal"></button>
      <input id="marketplaceToggle" type="checkbox">
      <div class="studio-step"></div>
      <div class="studio-section"></div>
      <div id="stepLabel"></div>
      <div id="stepCounter"></div>
      <button id="prevStep"></button>
      <button id="nextStep"></button>
    </div>

    <script type="module">
      const output = document.getElementById('output');
      const log = (message) => {
        output.textContent += `${message}\n`;
      };

      const samplePortfolio = {
        identity: {
          name: 'Test Portfolio',
          tagline: 'Test Studio',
          summary: 'A portfolio for browser tests.'
        },
        hero: {
          headline: 'Build better products',
          description: 'A polished portfolio experience',
          eyebrow: 'Studio'
        },
        contact: {
          email: 'hello@example.com',
          location: 'Remote',
          website: 'https://example.com',
          linkedin: 'https://linkedin.com/in/example',
          resume: 'https://example.com/resume.pdf'
        },
        meta: {
          title: 'Test Studio',
          description: 'A sample portfolio used for browser tests.'
        },
        experience: [],
        projects: [],
        testimonials: [],
        awards: [],
        skills: [],
        components: {},
        theme: {}
      };

      window.fetch = async (url) => {
        const normalized = String(url || '').replace(/^\.\//, '');
        if (normalized.includes('portfolio.json')) {
          return new Response(JSON.stringify(samplePortfolio), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }
        return new Response('', { status: 404, headers: { 'Content-Type': 'text/plain' } });
      };

      const { AssetStore } = await import('../js/asset-store.js');
      const { PortfolioDataService } = await import('../js/portfolio-data-service.js');
      window.AssetStoreCtor = AssetStore;
      window.PortfolioServiceCtor = PortfolioDataService;

      const { runAssetStoreTests } = await import('./asset-store.test.js');
      const { runStudioIntegrationTests } = await import('./studio-integration.test.js');

      window.runAssetTests = async () => {
        output.textContent = '';
        try {
          const assetResults = await runAssetStoreTests({ AssetStoreClass: AssetStore, output: log });
          const studioResults = await runStudioIntegrationTests({ output: log });
          log(`Passed ${assetResults.passed + studioResults.passed} assertions.`);
        } catch (error) {
          log(`FAIL ${error.message}`);
        }
      };

      document.getElementById('runTests').addEventListener('click', () => window.runAssetTests());
      window.runAssetTests();
    </script>
  </body>
</html>
